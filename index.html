<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1712">
  <title>Congkak: Guli Gila</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="fireflies" class="fireflies" aria-hidden="true"></div>

  <div id="app">
    <header class="topbar">
      <button id="btnMenu" class="chip-btn" type="button" data-t="menu"></button>
      <div id="roundLabel" class="round-label"></div>
      <button id="btnRules" class="chip-btn" type="button" aria-label="Rules">?</button>
    </header>

    <div id="hud" class="hud"></div>

    <div class="arena">
      <!-- Roguelite: opponent and hero portraits in the left margin (small ones in the bars on narrow screens) -->
      <aside id="fighters" class="fighters" aria-hidden="true"></aside>

      <div class="player-bar top" id="bar1"><span class="bar-art"></span><span class="name"></span><span class="fx"></span><span class="store-count"></span></div>

      <div class="board-wrap">
        <div id="board" class="board"></div>
        <div id="toast" class="toast"></div>
        <div id="combo" class="combo" aria-live="polite"></div>
      </div>

      <div class="player-bar bottom" id="bar0"><span class="bar-art"></span><span class="name"></span><span class="fx"></span><span class="store-count"></span></div>
    </div>

    <div id="tray" class="tray"></div>

    <div id="status" class="status"></div>
    <div class="rotate-hint" data-t="rotate"></div>
  </div>

  <div id="overlay" class="overlay hidden"><div id="modal" class="modal"></div></div>

  <script src="js/engine.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/rogue.js"></script>
  <script src="js/pixel.js"></script>
  <script src="js/music.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
